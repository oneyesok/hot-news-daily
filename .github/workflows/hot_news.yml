name: 每日热点推送

on:
  schedule:
    # 北京时间 08:00 / 12:00 / 15:00 / 18:00 / 21:00
    # → UTC     00:00 / 04:00 / 07:00 / 10:00 / 13:00
    - cron: '0 0,4,7,10,13 * * *'
  workflow_dispatch:

jobs:
  hot-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hot news
        run: python run.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
