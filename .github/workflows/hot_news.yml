name: 每日热点推送

on:
  schedule:
    # 每天 08:00、12:00、15:00、18:00、21:00 UTC = 北京时间 16:00、20:00、23:00、02:00、05:00
    # 改成北京时间每天 8点、12点、15点、18点、21点 = UTC 0点、4点、7点、10点、13点
    - cron: '0 0,4,7,10,13 * * *'
  workflow_dispatch:  # 支持手动触发
    inputs:
      test_mode:
        description: '测试模式（仅抓取不发送邮件）'
        required: false
        default: 'false'

jobs:
  hot-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 发送热点邮件
        run: python hot_news.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
